<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 · H9 월간 수익률 변동 관리</title>
<style>
  :root{--bg:#1b2735;--panel:#243343;--line:#3a4d63;--ink:#eef3f9;--muted:#9db0c6;--accent:#3ea6ff;--accent2:#2b7fd4;--bad:#ef6b6b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Segoe UI',-apple-system,'Malgun Gothic',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:32px;width:100%;max-width:360px}
  h1{font-size:18px;margin-bottom:6px}
  .sub{color:var(--muted);font-size:12px;margin-bottom:22px}
  label{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-bottom:6px}
  input{width:100%;background:#2c3d50;border:1px solid var(--line);color:var(--ink);padding:11px 12px;border-radius:8px;font-size:14px;font-family:inherit}
  input:focus{outline:none;border-color:var(--accent)}
  button{width:100%;margin-top:16px;background:var(--accent);color:#04121f;border:none;padding:11px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer}
  button:hover{background:var(--accent2);color:#fff}
  button:disabled{opacity:.6;cursor:not-allowed}
  .err{color:var(--bad);font-size:12px;margin-top:12px;min-height:16px;text-align:center}
</style>
</head>
<body>
<form class="box" id="loginForm">
  <h1>H9 월간 수익률 변동 관리</h1>
  <div class="sub">계속하려면 접근 비밀번호를 입력하세요.</div>
  <label for="pw">비밀번호</label>
  <input id="pw" type="password" autocomplete="current-password" autofocus>
  <button type="submit" id="btn">로그인</button>
  <div class="err" id="err"></div>
</form>
<script>
const form=document.getElementById('loginForm'),btn=document.getElementById('btn'),err=document.getElementById('err');
form.onsubmit=async(e)=>{
  e.preventDefault();err.textContent='';btn.disabled=true;btn.textContent='확인 중…';
  try{
    const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pw').value})});
    if(r.ok){location.href='/';return;}
    const d=await r.json().catch(()=>({}));
    err.textContent=d.error||'로그인에 실패했습니다.';
  }catch(e2){err.textContent='서버에 연결할 수 없습니다.';}
  btn.disabled=false;btn.textContent='로그인';
};
</script>
</body>
</html>
