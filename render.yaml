# Render Blueprint — https://render.com
# GitHub 리포를 연결하면 이 파일을 읽어 웹 서비스를 자동 구성합니다.
# 비밀값(sync:false)은 Render 대시보드에서 직접 입력합니다.
services:
  - type: web
    name: h9-monthly-profit
    runtime: node
    plan: free
    region: singapore        # Supabase(ap-northeast-2, 서울)와 가장 가까운 무료 리전
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # ⚠️ PMO 프로젝트 관리(h9-pmo)와 반드시 '같은 값' 이어야 계정/세션이 통합됩니다.
      - key: SESSION_SECRET
        sync: false
      - key: MONTHLY_APP_URL
        value: https://h9-monthly-profit.onrender.com
      - key: PMO_APP_URL
        value: https://h9-pmo.onrender.com
      - key: ALLOWED_EMAIL_DOMAIN
        value: hnine.com
      - key: ADMIN_EMAIL       # 최초 관리자 계정
        sync: false
      # 회사 계정(Google) SSO — 설정하면 로그인 화면에 버튼이 생깁니다
      - key: OIDC_PROVIDER
        value: google
      - key: OIDC_CLIENT_ID
        sync: false
      - key: OIDC_CLIENT_SECRET
        sync: false
      - key: PGHOST
        sync: false
      - key: PGPORT
        sync: false
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: PGDATABASE
        sync: false
      # (구버전 호환) 기존 단일 비밀번호. 최초 관리자 비밀번호 승계에만 쓰입니다.
      - key: APP_PASSWORD
        sync: false
