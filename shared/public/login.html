<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 · H9</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%233ea6ff%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2714%27 font-family=%27Segoe UI,sans-serif%27 font-weight=%27bold%27 fill=%27%2305121f%27 text-anchor=%27middle%27%3EH9%3C/text%3E%3C/svg%3E">
<style>
  :root{--bg:#141c26;--panel:#1e2b3a;--panel2:#2a3a4d;--line:#38506a;--ink:#eef3f9;--muted:#93a8c0;--accent:#3ea6ff;--accent2:#2b7fd4;--bad:#ef6b6b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(1200px 600px at 20% -10%,#20344a 0%,var(--bg) 60%);color:var(--ink);font-family:'Segoe UI',-apple-system,'Malgun Gothic',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:34px;width:100%;max-width:390px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
  .brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#7d5cff);display:flex;align-items:center;justify-content:center;font-weight:800;color:#05121f;font-size:14px}
  .brand b{font-size:16px;letter-spacing:-.2px}
  .brand span{display:block;color:var(--muted);font-size:11px;font-weight:400;margin-top:1px}
  label{display:block;color:var(--muted);font-size:12px;font-weight:600;margin:14px 0 6px}
  input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:11px 12px;border-radius:9px;font-size:14px;font-family:inherit}
  input:focus{outline:none;border-color:var(--accent)}
  button{width:100%;margin-top:20px;background:var(--accent);color:#04121f;border:none;padding:12px;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer}
  button:hover{background:var(--accent2);color:#fff}
  button:disabled{opacity:.6;cursor:not-allowed}
  .err{color:var(--bad);font-size:12px;margin-top:12px;min-height:16px;text-align:center}
  .hint{color:var(--muted);font-size:11px;margin-top:16px;text-align:center;line-height:1.6}
  .sso{width:100%;margin:0;background:#fff;color:#1f1f1f;border:none;padding:12px;border-radius:9px;
    font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
  .sso:hover{background:#eaeef3;color:#1f1f1f}
  .sso svg{width:18px;height:18px;flex:none}
  .sso-alt{display:block;text-align:center;margin-top:10px;color:var(--muted);font-size:11.5px;
    text-decoration:none;cursor:pointer}
  .sso-alt:hover{color:var(--accent);text-decoration:underline}
  .or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11px;margin:20px 0 4px}
  .or::before,.or::after{content:'';flex:1;height:1px;background:var(--line)}
  #ssoBox,#pwBox{display:none}
</style>
</head>
<body>
<form class="box" id="loginForm">
  <div class="brand">
    <div class="mark">H9</div>
    <div><b id="appTitle">H9 통합 로그인</b><span>회사 메일 계정으로 로그인하세요</span></div>
  </div>
  <div id="ssoBox">
    <button type="button" class="sso" id="ssoBtn">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      <span id="ssoLabel">회사 계정으로 로그인</span>
    </button>
    <a class="sso-alt" id="ssoAlt">다른 계정으로 로그인 / 계정 선택</a>
    <div class="or">또는 비밀번호로 로그인</div>
  </div>
  <a class="sso-alt" id="pwToggle" style="display:none">비밀번호로 로그인 (관리자용)</a>

  <div id="pwBox">
    <label for="email">회사 이메일</label>
    <input id="email" type="email" autocomplete="username" placeholder="name@hnine.com">
    <label for="pw">비밀번호</label>
    <input id="pw" type="password" autocomplete="current-password">
    <button type="submit" id="btn">로그인</button>
  </div>
  <div class="err" id="err"></div>
  <div class="hint">계정이 없거나 로그인이 제한된 경우 PMO 관리자에게 문의하세요.<br>수익률 관리 · PMO 프로젝트 관리는 같은 계정을 사용합니다.</div>
</form>
<script>
const form=document.getElementById('loginForm'),btn=document.getElementById('btn'),err=document.getElementById('err');
const APP_NAME={profit:'H9 프로젝트 수익률 관리',pmo:'H9 PMO 프로젝트 관리'};
const nextUrl=new URLSearchParams(location.search).get('next')||'/';
// SSO 콜백에서 되돌아온 오류 메시지 표시
const qErr=new URLSearchParams(location.search).get('err');
if(qErr)err.textContent=qErr;

fetch('/api/me').then(r=>r.json()).then(m=>{
  if(m.app&&APP_NAME[m.app])document.getElementById('appTitle').textContent=APP_NAME[m.app];
  if(m.authed)location.href=nextUrl;
  if(m.emailDomain)document.getElementById('email').placeholder='name@'+m.emailDomain;
}).catch(()=>{});

// 회사 계정 SSO 사용 가능 여부
fetch('/api/auth/config').then(r=>r.json()).then(c=>{
  const pwBox=document.getElementById('pwBox');
  if(c&&c.enabled){
    document.getElementById('ssoBox').style.display='block';
    document.getElementById('ssoLabel').textContent=c.label+'으로 로그인';
    const go=(sel)=>{location.href='/auth/login?next='+encodeURIComponent(nextUrl)+(sel?'&select=1':'');};
    document.getElementById('ssoBtn').onclick=()=>go(false);
    document.getElementById('ssoAlt').onclick=()=>go(true);
    document.getElementById('pwToggle').onclick=()=>{
      document.getElementById('pwBox').style.display='block';
      document.getElementById('pwToggle').style.display='none';
      document.getElementById('email').focus();
    };
    // 자동 SSO 가 켜져 있으면 보통 이 화면을 볼 일이 없습니다.
    // (오류로 되돌아온 경우이거나 /?pw=1 로 들어온 경우)
    if(c.auto&&!qErr&&!new URLSearchParams(location.search).has('pw')){
      pwBox.style.display='none';
      document.getElementById('pwToggle').style.display='block';
    }else{
      pwBox.style.display='block';
    }
  }else{
    pwBox.style.display='block';
    document.getElementById('email').focus();
  }
}).catch(()=>{document.getElementById('pwBox').style.display='block';});
form.onsubmit=async(e)=>{
  e.preventDefault();err.textContent='';btn.disabled=true;btn.textContent='확인 중…';
  try{
    const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('pw').value})});
    if(r.ok){location.href=nextUrl;return;}
    const dj=await r.json().catch(()=>({}));
    err.textContent=dj.error||'로그인에 실패했습니다.';
  }catch(e2){err.textContent='서버에 연결할 수 없습니다.';}
  btn.disabled=false;btn.textContent='로그인';
};
</script>
</body>
</html>
